<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#1e3a8a"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="kasbahGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyGrad)"/>
  
  <!-- Glowing Sun -->
  <circle cx="600" cy="380" r="140" fill="#fef08a" opacity="0.6"/>
  <circle cx="600" cy="380" r="90" fill="#ffffff" opacity="0.8"/>

  <!-- Distant High Atlas Peaks with Snow -->
  <polygon points="0,420 180,260 320,380 480,210 680,410 820,240 1020,390 1200,280 1200,500 0,500" fill="url(#mountainFar)"/>
  <!-- Snow on peaks -->
  <polygon points="180,260 150,300 210,300" fill="#f8fafc" opacity="0.9"/>
  <polygon points="480,210 440,265 520,265" fill="#f8fafc" opacity="0.9"/>
  <polygon points="820,240 780,290 860,290" fill="#f8fafc" opacity="0.9"/>

  <!-- Midground Mountains -->
  <polygon points="0,460 260,340 540,470 780,330 1060,450 1200,380 1200,560 0,560" fill="url(#mountainMid)"/>

  <!-- Foreground Kasbah (Berber Fortress of Ouarzazate / Ait Benhaddou style) -->
  <g id="kasbah">
    <!-- Main Tower Left -->
    <rect x="740" y="290" width="110" height="260" fill="url(#kasbahGrad)"/>
    <polygon points="730,290 795,250 860,290" fill="#9a3412"/>
    <!-- Crenellations / battlements -->
    <rect x="740" y="280" width="20" height="15" fill="#7c2d12"/>
    <rect x="770" y="280" width="20" height="15" fill="#7c2d12"/>
    <rect x="800" y="280" width="20" height="15" fill="#7c2d12"/>
    <rect x="830" y="280" width="20" height="15" fill="#7c2d12"/>
    <!-- Windows & geometric friezes -->
    <rect x="775" y="320" width="18" height="35" rx="9" fill="#1e1b4b"/>
    <rect x="805" y="320" width="18" height="35" rx="9" fill="#1e1b4b"/>
    <rect x="790" y="380" width="20" height="40" rx="10" fill="#1e1b4b"/>

    <!-- Central High Wall -->
    <rect x="840" y="340" width="180" height="210" fill="url(#kasbahGrad)"/>
    <!-- Decorative Berber Chevron Frieze on Wall -->
    <path d="M850 360 L865 375 L880 360 L895 375 L910 360 L925 375 L940 360 L955 375 L970 360 L985 375 L1000 360" stroke="#fcd34d" stroke-width="4" fill="none"/>
    <rect x="915" y="420" width="36" height="70" rx="18" fill="#1e1b4b"/>

    <!-- Main Tower Right -->
    <rect x="1010" y="310" width="100" height="240" fill="url(#kasbahGrad)"/>
    <polygon points="1000,310 1060,270 1120,310" fill="#9a3412"/>
    <rect x="1045" y="340" width="18" height="35" rx="9" fill="#1e1b4b"/>
  </g>

  <!-- Rolling Terraced Ground -->
  <path d="M0 510 Q300 480 650 530 T1200 520 L1200 675 L0 675 Z" fill="url(#groundGrad)"/>

  <!-- Ancient Olive Tree Left Silhouette -->
  <path d="M120 600 Q140 480 180 430 Q160 380 130 360 Q170 340 220 370 Q260 330 320 350 Q300 390 310 440 Q340 490 350 590 Z" fill="#2d1305"/>
  <!-- Foliage -->
  <ellipse cx="210" cy="380" rx="120" ry="70" fill="#14532d" opacity="0.9"/>
  <ellipse cx="260" cy="350" rx="90" ry="60" fill="#166534" opacity="0.95"/>
  <ellipse cx="170" cy="360" rx="70" ry="50" fill="#15803d" opacity="0.9"/>

  <!-- Golden Yaz Symbol ⵣ Watermark / Emblem -->
  <g transform="translate(100, 80) scale(1.1)" opacity="0.35">
    <line x1="50" y1="10" x2="50" y2="90" stroke="#fde047" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 25 Q50 5 80 25" stroke="#fde047" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M20 75 Q50 95 80 75" stroke="#fde047" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title Ribbon Banner -->
  <rect x="360" y="585" width="480" height="55" rx="28" fill="#0f172a" opacity="0.85"/>
  <text x="600" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#fde047" text-anchor="middle">ⵜⵉⵏⴼⵓⵙⵉⵏ ⵜⵉⵎⴰⵣⵉⵖⵉⵏ • القصص الأمازيغية التراثية</text>
</svg>